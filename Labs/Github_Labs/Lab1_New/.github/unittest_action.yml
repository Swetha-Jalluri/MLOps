name: Wine Model Python Unittests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unittests
      run: |
        python -m unittest test.test_unittest -v
      continue-on-error: false
    
    - name: Run unittest with XML output
      run: |
        python -m xmlrunner test.test_unittest -o test-results
      continue-on-error: true
    
    - name: Upload test results
      uses: actions/upload-artifact@v2
      if: always()
      with:
        name: unittest-results
        path: test-results/
    
    - name: Notify on success
      if: success()
      run: echo "✅ All Wine Model Unittests passed successfully!"
    
    - name: Notify on failure  
      if: failure()
      run: echo "❌ Wine Model Unittests failed. Please check the logs."