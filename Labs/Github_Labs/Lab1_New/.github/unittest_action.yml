name: Wine Model Python Unittests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # for XML reports (optional if already in requirements.txt)
          pip install unittest-xml-reporting

      - name: Run unittests (discovery)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run unittests with XML output (optional)
        if: always()
        run: |
          mkdir -p test-results
          python -m xmlrunner discover -s tests -p "test_*.py" -o test-results || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-results
          path: test-results/

      - name: Summary
        if: always()
        run: |
          echo "Wine Model Unittest Results" >> $GITHUB_STEP_SUMMARY
          if [ -d test-results ]; then
            echo "XML results uploaded from test-results/" >> $GITHUB_STEP_SUMMARY
          fi
