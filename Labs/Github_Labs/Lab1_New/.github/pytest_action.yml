name: Wine Model Testing with Pytest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ensure coverage plugin is available
          pip install pytest-cov

      - name: Run Pytest with coverage
        run: |
          pytest -v --junitxml=pytest-report.xml --cov=src --cov-report=xml --cov-report=term

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-report.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Summary
        if: always()
        run: |
          echo "Wine Model Pytest Results" >> $GITHUB_STEP_SUMMARY
          if [ -f pytest-report.xml ]; then
            echo "JUnit report: pytest-report.xml" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f coverage.xml ]; then
            echo "Coverage report: coverage.xml" >> $GITHUB_STEP_SUMMARY
          fi
